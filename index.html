<!DOCTYPE html>
<html lang="zh-TW" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // 主畫面 App（PWA）不允許放大縮小（Jason 2026/10/20）；一般瀏覽器維持可縮放（無障礙）。
      // iOS 會忽略 user-scalable=no，另外攔截雙指手勢（gesturestart）並以 touch-action 擋掉雙擊放大
      (function () {
        var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        if (!standalone) return
        var viewport = document.querySelector('meta[name=viewport]')
        if (viewport) viewport.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover')
        document.addEventListener('gesturestart', function (event) { event.preventDefault() }, { passive: false })
        document.documentElement.style.touchAction = 'pan-x pan-y'
      })()
    </script>
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BOS" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
