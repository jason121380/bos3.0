# 前端 CI。舊檔 .github/workflows/node.js.yml 在 GitHub 上被手動停用（disabled_manually），
# 停用狀態綁在那個檔案路徑，沒有分支保護也無法用 token 重新啟用。
# 這個新路徑會註冊成另一個 workflow，預設啟用，不需要 GitHub Pro 或分支保護。
# 任何 branch 的 push 與所有 PR 都會跑：安裝一次、lint／build 與 test 各自獨立。

name: Frontend CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.22.1
  CYPRESS_INSTALL_BINARY: 0

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Format check (Prettier)
        run: npm run format:check
      - name: Lint (build rules)
        run: npm run lint:build
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    # 覆蓋率收集比 test:nowatch 慢（插樁）；main 上 test:nowatch 約 15 分鐘，留足餘裕
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # 全套單元測試＋覆蓋率門檻（package.json 的 coverageThreshold）。
      # 取代原本的 test:nowatch：同一次執行就跑完全部測試，未達門檻時以 exit 1 擋下，不必再跑第二遍。
      - name: Test with coverage thresholds
        run: npm run test:coverage
        env:
          CI: true

  # 全站畫面掃描：每個後台路由在手機（390×844）與桌機（1366×800）各開一次，主要頁面另跑深色模式；
  # 檢查沒有錯誤邊界「這個頁面發生錯誤」、沒有橫向捲動、沒有未捕捉的 console error（e2e/visual.spec.js）。
  # 另跑資料晚到掃描（e2e/late-arrival.spec.js）：每個路由讓頁面的每個查詢輪流晚回，檢查不會進錯誤邊界。
  # 用 vite build 的靜態檔＋假 GraphQL，外部連線一律 abort，不連任何後端（CLAUDE.md 鐵則 5）。
  visual:
    name: Visual scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Visual scan and late-arrival scan
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-scan-results
          path: e2e/e2e-results/
          retention-days: 7
