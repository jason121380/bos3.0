# 任何 branch 的 push 與所有 PR 都會跑：安裝一次、build 與 test 各自獨立一個 job（其中一個失敗不會遮住另一個的結果）。
# 套件安裝方式與 Dockerfile 一致：npm + --legacy-peer-deps（專案只有 package-lock.json，沒有 yarn.lock）。

name: Node.js CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# 同一個 branch 連續 push 時，取消尚未跑完的舊執行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.12.1 # 與 Dockerfile、cloudbuild.yaml 的 node:20.12.1 相同
  CYPRESS_INSTALL_BINARY: 0 # build 與單元測試不需要 Cypress 執行檔，略過下載

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # 與原 CRA build 內建的 ESLint 檢查相同（react-app/base；Vite 不跑 ESLint，改為獨立步驟）
      - name: Lint (build rules)
        run: npm run lint:build
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Test
        run: npm run test:nowatch

  # 舊的 E2E 設定（Node 12、ubuntu-16.04 已被 GitHub 移除、yarn）。
  # 尚未驗證能在新環境執行，所以不放進 push／PR 流程，只在手動觸發（Run workflow）時執行，等確認要不要保留再處理。
  # Cypress record key 改由 repo secret `CYPRESS_RECORD_KEY` 提供（原本明文寫在這裡與 package.json，舊 key 應至 Cypress Cloud 撤銷）。
  cypress-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-16.04
    name: E2E on Chrome
    strategy:
      matrix:
        node-version: [12.x]
    steps:
      - uses: actions/checkout@v2
      - name: Install project dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true' # Over here!
        run: yarn
      - name: Cypress run
        uses: cypress-io/github-action@v2
        with:
          browser: chrome
          headless: true
          record: true
          start: yarn start
          wait-on: http://localhost:3000
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
